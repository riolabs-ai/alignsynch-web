<title>Comments on an Aspect, a session and a relationship · prototype v2 · AlignSynch 2.0</title>
<!--
  ============================================================================
  prototype-comments-v2.html — #921, revision 2.

  v1 (prototype-comments-v1.html) drew a generic thread beside the subject on
  the QuizHub palette (--action #6366f1). The owner's 2026-11-23 verdict is that
  it is stale and not conformant to the approved 2.0 UI. v1 is left untouched;
  this file is the new drawing and it is assembled from two sources only.

  WHAT IT DECIDES
    Where one comment thread renders for an ASPECT OPINION and for a SESSION
    (assessment) SUMMARY — Variant A inline under the subject, or Variant B a
    side panel. Both are drawn for every state; the choice is the owner's.
    For the RELATIONSHIP the placement is already settled by bundle 07 (one
    full-width thread on the chat surface); its two variants are drawn only so
    the same anatomy can be judged inside a 20rem panel before it is copied
    there for the other two subjects.

  ANCESTORS (read before this file was drawn)
    components/quiz/comment.tsx          // template-ancestor: components/ui/card.tsx
                                          — avatar, author, timestamp, body, vote,
                                            Reply, Show Replies (n)/Hide Replies,
                                            one level of replies on a 2px rail
    components/quiz/question-discussion.tsx  — the per-question thread + composer
    data/quiz-comments.ts + content/quiz-result.ts   — QuizComment/QuizCommentThread
    components/assessment-flow/alignment-view.tsx    — the Aspect card and the
                                          Align summary, class strings copied out
    components/media/generated-avatar.tsx — avatarGradient(), transcribed below
    lib/category-gradient.ts             — slugSeed(), monogramOf(), gradientFor()

  THREAD ANATOMY — settled by
    project-spec/spec-design-v2-bundles/07-spec-design-page-chat-v2/chat.html
    (avatar · author · Aspect tag · body · timestamp; the composer with its
    "Tag an Aspect" row; the empty invitation; the paused read-only band).
    A flat message stream (components/chat/chat-message.tsx) is NOT the ancestor
    for the Aspect and session placements — a thread with replies is.

  TOKENS
    css/tokens.css + js/tw-config.js from the same bundle. TWO of those roles are
    COMPLETE colours and are used unwrapped — --action-hover (#2a373e) and
    --accent-press (#0693b8). Every other role is a bare HSL triple and is used
    inside hsl(...). Writing a shade token as a triple emits
    `background: 42 26% 20%`, which the browser drops: the fill goes transparent
    and every gate stays green. See .btn--primary:hover below, which reads
    var(--action-hover) raw.
    Each value below is also present verbatim in quizhub/app/globals.css at the
    head this was drawn on, so the two cannot drift silently.

    RADIUS is the bundle's 0.5rem (lg 8 / md 6 / sm 4), i.e. the approved 2.0
    density. The shipping tree still resolves --radius to 0.3125rem (lg 5 / md 3)
    because #1120 parks that change behind a separate card. This artifact draws
    the approved density; the difference is named here rather than left to be
    spotted.

  NO SCHEMA, NO ROUTE, NO SPEC. The durable thread model (one polymorphic
  subject_comment vs three foreign keys) stays a spec decision for after this
  mockup is approved. Nothing in this file is imported by the app.
  ============================================================================
-->

  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-font-smoothing:antialiased}
  body{

  /* ---------- the prototype chrome: not part of any screen ---------- */

  /* ---------- the stage ---------- */
  .stage{padding:1.25rem .75rem 4rem}
  /* Variant A: the thread sits inside the subject's own band, directly under
     the row, so it reads as part of the record rather than as a second page. */
  .stack{display:flex;flex-direction:column;gap:.75rem}
  .thread-inline{background:hsl(var(--mist));border:1px solid hsl(var(--border));border-radius:var(--r-lg);padding:.75rem}

  .stage-note{margin-top:.375rem;max-width:52rem;font-size:.8125rem;color:hsl(var(--foreground))}
  .stage-actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.75rem}
  .frame{max-width:var(--frame-max);margin:0 auto}
  .frame.is-narrow{width:390px;max-width:100%;border:1px dashed hsl(var(--line));padding:.5rem;background:hsl(var(--paper));border-radius:var(--r-lg)}

    content:"390px";display:block;font-size:.6875rem;font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;color:hsl(var(--muted-foreground));margin:0 0 .375rem .125rem;
  }

  /* Variant B — the bundle's `detail` grid: minmax(0,1fr) 20rem */

    font-size:.875rem;font-weight:500;text-decoration:none;cursor:pointer;background:transparent;

  .btn--primary{background:hsl(var(--action));color:hsl(var(--action-foreground))}
  /* the shade token is a COMPLETE colour in tokens.css — read raw, never hsl()-wrapped */

  /* ==========================================================================

  function sessionSubject() {

    });

  /* ==========================================================================

  function message(opts) {
    var person = opts.person;

        (own && opts.canDelete ? '<button type="button" class="btn btn--ghost btn--danger">' + ICON.trash + "Delete</button>" : "") +

  /* The bundle's own lines, one word changed where the bundle's Aspect differs

  function composer(opts) {

  function thread(subjectKey, state, uid) {

             repeated on every message there; it stays where a thread spans Aspects */
          tag: Boolean(m.tag) && subjectKey !== "aspect",

  function threadFor(screen) {

  /* ==========================================================================

  function screenNumber(screen) {

  function stateScreen(screen) {

          "<li><strong>The Aspect card and the session summary</strong> are <code>components/assessment-flow/alignment-view.tsx</code> — the numbered card, the painted 1–5 track, the party markers, the Gap band, the tolerance toggle, the summary counts, the segments and the legend. Labels come from <code>data/pages/assessment-instance.ts</code>.</li>" +
          "<li><strong>The thread</strong> is <code>project-spec/spec-design-v2-bundles/07-spec-design-page-chat-v2/chat.html</code> — party-tinted bubbles, the Aspect tag inside the bubble, the composer, the paused band. Its vote, Reply, Show Replies (n)/Hide Replies and the reply rail are <code>components/quiz/comment.tsx</code>.</li>" +
          "<li><strong>The data shape</strong> the drawn thread stands for is <code>QuizComment</code>/<code>QuizCommentThread</code> (<code>content/quiz-result.ts</code>) as <code>data/quiz-comments.ts</code> projects it: one comment, one level of replies, an author, a body, an instant.</li>" +
          "<li><strong>Tokens</strong> are the bundle's <code>css/tokens.css</code> + <code>js/tw-config.js</code>, and each value is also in <code>app/globals.css</code> at the head this was drawn on. <code>--action-hover</code> and <code>--accent-press</code> are complete colours and are read unwrapped; every other role is a bare HSL triple.</li>" +
          "<li><strong>Radius</strong> is the bundle's 0.5rem (lg 8 / md 6 / sm 4). The shipping tree still resolves 0.3125rem (lg 5 / md 3) because #1120 parks that change; this artifact draws the approved density and says so rather than leaving it to be spotted.</li>" +
          "<li><strong>Aspect titles are the bundle's short names</strong> (<em>Contact Frequency</em>, <em>Parent Decisions</em>). The shipped Align card renders <code>row.prompt</code> instead, because an Aspect carries the question only — <code>data/pages/dashboard-relationship-detail.ts</code> records that bundle 04's reference has both. If the short name is what the design wants, the model needs the field, and that is a spec decision after this mockup.</li>" +
          "</ul>" +
        "</div>" +
        '<div class="panel">' +
          "<h2>Derivations — computed, not hand-picked</h2>" +
          "<p>Artwork on these screens is drawn, never chosen. <code>avatarGradient()</code> is transcribed from <code>components/media/generated-avatar.tsx</code>: FNV-1a over the seed, then each stop's HSL lightness solved by bisection for a target relative luminance, then the ink picked as whichever of white and near-black scores higher over both stops. The width probe's seed resolves to:</p>" +
          "<p><code>" + probe.seed + "</code><br><code>" + grad.css + "</code><br>ink <code>" + grad.ink + "</code>, angle " + grad.angle + "°</p>" +
          "<p>A subject tile would be <code>gradientFor()</code> + <code>monogramOf()</code> (<code>lib/category-gradient.ts</code>); no screen here draws one, so that pair is carried in the file only for the next revision that needs a cover. "+ chip + "</p>" +
        "</div>" +
        '<div class="panel proposed">' +
          "<h2>Proposed copy — the only words with no shipped home</h2>" +
          "<ul>" +
          "<li><em>Edit</em> and <em>Delete</em> — the reader's own comment controls. <code>comment.tsx</code> draws a vote, Reply and Hide/Show Replies only.</li>" +
          "<li><em>No Comments Yet</em> / <em>Nothing has been said about this Aspect.</em> — the empty thread under an Aspect; the session placement reuses it with <em>…about this session.</em></li>" +
          "<li><em>Discuss</em> as the thread's header for the Aspect and session placements. The word is shipped — it is the Aspect card's own button (<code>data/pages/assessment-instance.ts</code> <code>itemLabel(section, \"discuss\")</code>) — but using it as a section heading is new.</li>" +
          "<li><em>Stage 6 is paused, so comments are read-only. Nothing is lost.</em> — the locked band for an Aspect and a session. It is bundle 07's chat sentence with one noun changed, because the relationship's own sentence says <em>chat</em>.</li>" +
          "</ul>" +
          "<p>Everything else on these screens is transcribed: <em>Discuss</em>, <em>Feel</em>, <em>Wish</em>, <em>In Synch</em>, <em>Small Gap</em>, <em>Gap</em>, <em>Reading</em>, <em>Aspects Aligned</em>, <em>Next Step</em>, <em>Start the Conversation</em>, <em>Add a Card</em>, <em>Message Elena</em>, <em>Tag</em>, <em>Reply</em>, <em>Show Replies (1)</em>, <em>Hide Replies</em>, <em>Chat Opens When Tomás Joins</em>, <em>Invite sent Nov 14.</em></p>" +
        "</div>" +
        '<div class="panel">' +
          "<h2>The " + (SCREENS.length - 1) + " screens</h2>" +
          '<table class="grid"><thead><tr><th style="width:3rem">#</th><th>Subject</th><th>Placement</th><th>State</th><th style="width:3.5rem"></th></tr></thead><tbody>' +
          rows + "</tbody></table>" +
        "</div>" +
      "</div>";
  }

  function gradientForHint() {
    var seed = seedHash("contact-frequency");
    var from = seed % 360;
    var to = (from + 40 + (Math.floor(seed / 360) % 200)) % 360;
    var angle = 45 + (Math.floor(seed / 72000) % 8) * 45;
    return "Seeded for reference: <code>gradientFor(\"contact-frequency\")</code> → hue " + from + "° → " + to +
      "°, angle " + angle + "°, monogram <code>" + monogramOf("Contact Frequency") + "</code> — the same " +
      "function, so a future revision that draws a cover draws this one. The transcript of " +
      "<code>gradientFor()</code> in this file computes <code>" + gradientFor("contact-frequency") + "</code>.";
  }

  /* ==========================================================================
     ROUTER — #stage=n, n−1 as the index
     ========================================================================== */
  var stageEl = document.getElementById("stage");
  var indexEl = document.getElementById("index");

  function stageFromHash() {
    var match = /stage=(\d+)/.exec(window.location.hash || "");
    var n = match ? parseInt(match[1], 10) : 1;
    if (!Number.isFinite(n) || n < 1 || n > SCREENS.length) n = 1;
    return n;
  }

  function renderIndex(n) {
    var current = SCREENS[n - 1];
    var subjectIndex = current.kind === "state" ? SUBJECTS.indexOf(current.subject) : 0;
    var placementIndex = current.kind === "state" ? PLACEMENTS.indexOf(current.placement) : 0;
    var stateKey = current.kind === "state" ? current.state.key : null;
    var base = 2 + subjectIndex * 18;

    function row(label, items) {
      return '<div class="index-row"><span class="index-label">' + label + "</span>" + items.join("") + "</div>";
    }
    function tab(href, text, active, title) {
      return '<a class="tab" href="' + href + '"' + (active ? ' aria-current="true"' : "") +
        (title ? ' title="' + title + '"' : "") + ">" + text + "</a>";
    }

    var subjects = SUBJECTS.map(function (subject, index) {
      return tab("#stage=" + (2 + index * 18), subject.label,
        current.kind === "state" && index === subjectIndex, subject.sub);
    });
    var placements = PLACEMENTS.map(function (placement, index) {
      return tab("#stage=" + (base + index * 9), placement.label,
        current.kind === "state" && index === placementIndex);
    });
    var states = STATES.map(function (state, index) {
      return tab("#stage=" + (base + placementIndex * 9 + index), (index + 1) + " " + state.short,
        state.key === stateKey, state.label);
    });

    indexEl.innerHTML =
      row("Screen", [tab("#stage=1", "Index", n === 1)]) +
      row("Subject", subjects) +
      row("Placement", placements) +
      row("State", states) +
      row("Where", ['<span class="muted xs">stage ' + n + " of " + SCREENS.length + "</span>"]);
  }

  /* Every string handed to innerHTML below is a literal from this file or an
     integer derived from the hash — no URL text, no user input, no remote
     content reaches the DOM. */
  function render() {
    var n = stageFromHash();
    var screen = SCREENS[n - 1];
    stageEl.innerHTML = screen.kind === "gallery" ? gallery() : stateScreen(screen);
    renderIndex(n);
    window.scrollTo(0, 0);
  }

  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
